version: 2

models:
  - name: stg_github__repo_snapshots
    description: Daily snapshot of each tracked repository, flattened and typed.
    columns:
      - name: snapshot_key
        description: Surrogate key (repo_full_name:snapshot_date).
        tests: [unique, not_null]
      - name: repo_full_name
        tests: [not_null]
      - name: snapshot_date
        tests: [not_null]
      - name: stars_count
        tests: [not_null]

  - name: stg_github__issues
    description: Issues and pull requests, latest version of each, flattened and typed.
    columns:
      - name: issue_key
        description: Surrogate key (repo_full_name:issue_id).
        tests: [unique, not_null]
      - name: state
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: commented for testing ['open', 'closed']
      - name: created_at
        tests: [not_null]
      - name: is_pull_request
        tests: [not_null]